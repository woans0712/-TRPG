<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>심심풀이 TRPG 시뮬레이터</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="auth" id="authView">
        <div class="brand">
          <p class="eyebrow">웹 TRPG 시뮬레이터</p>
          <h1>심심풀이 TRPG</h1>
          <p>GitHub Pages와 Supabase로 돌아가는 공동 채팅형 TRPG 세션입니다.</p>
        </div>
        <form class="auth-panel" id="authForm">
          <label>
            닉네임
            <input id="nickname" autocomplete="username" maxlength="20" required />
          </label>
          <label>
            비밀번호
            <input id="password" type="password" autocomplete="current-password" minlength="6" required />
          </label>
          <div class="auth-actions">
            <button type="button" id="loginBtn">로그인</button>
            <button type="button" id="registerBtn" class="secondary">프로필 제작</button>
          </div>
          <p class="error" id="authError"></p>
        </form>
      </section>

      <section class="game hidden" id="gameView">
        <aside class="side">
          <div class="topbar">
            <div>
              <p class="eyebrow">접속 프로필</p>
              <h2 id="meName">-</h2>
            </div>
            <button id="logoutBtn" class="icon-button" title="로그아웃">↪</button>
          </div>

          <div class="stat-grid">
            <div>
              <span>HP</span>
              <strong id="meHp">100</strong>
            </div>
            <div>
              <span>상태</span>
              <strong id="meStatus">정상</strong>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h3>현재 이벤트</h3>
              <span id="aiBadge">Supabase GM</span>
            </div>
            <h4 id="eventTitle">아직 사건 없음</h4>
            <p id="eventScene">새 이벤트를 시작하면 장면이 표시됩니다.</p>
            <p id="eventStakes"></p>
          </div>

          <div class="panel">
            <h3>이벤트 시작</h3>
            <textarea id="eventPrompt" rows="4">펜션에 좀비가 발생하는 생존 호러 이벤트</textarea>
            <button id="startEventBtn">새 이벤트 발생</button>
          </div>

          <div class="panel">
            <h3>자동 이벤트</h3>
            <label class="check">
              <input id="autoEvents" type="checkbox" />
              <span>특정 시간마다 자동 발생</span>
            </label>
            <label>
              간격(분)
              <input id="intervalMinutes" type="number" min="1" max="1440" value="60" />
            </label>
            <button id="saveSettingsBtn" class="secondary">설정 저장</button>
          </div>
        </aside>

        <section class="table">
          <header class="table-head">
            <div>
              <p class="eyebrow">공동 세션</p>
              <h2>행동 채팅</h2>
            </div>
            <div class="players" id="players"></div>
          </header>

          <div class="messages" id="messages"></div>

          <form class="composer" id="messageForm">
            <input id="messageInput" maxlength="500" placeholder="예: 목재로 문을 막는다" autocomplete="off" />
            <button>행동</button>
          </form>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
